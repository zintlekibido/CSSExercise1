<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second hand Musical Instruments</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="site-header">
        <h1>Second hand Musical Instruments</h1>
        <p>Find great deals on used musical gear and instruments</p>
    </header>

    <!-- Main Section Containing 6 Musical Instrument Product Cards -->
    <main class="product-container">
        
        <!-- Product Card 1: Acoustic Guitar -->
        <article class="product-card">
            <img src="https://images.unsplash.com/photo-1510915361894-db8b6010cb5c?auto=format&fit=crop&w=600&q=80" alt="Acoustic Guitar">
            <div class="product-info">
                <h2>Acoustic Folk Guitar</h2>
                <p class="price">R2,499.00</p>
                <button class="cart-btn">Add to Cart</button>
            </div>
        </article>

        <!-- Product Card 2: Electric Guitar -->
        <article class="product-card">
            <img src="https://images.unsplash.com/photo-1564186763535-ebb21ef5277f?auto=format&fit=crop&w=600&q=80" alt="Electric Guitar">
            <div class="product-info">
                <h2>Solid Body Electric Guitar</h2>
                <p class="price">R3,850.00</p>
                <button class="cart-btn">Add to Cart</button>
            </div>
        </article>

        <!-- Product Card 3: Digital Keyboard / Piano -->
        <article class="product-card">
            <img src="https://images.unsplash.com/photo-1520523839896-51203b9b47e8?auto=format&fit=crop&w=600&q=80" alt="Digital Keyboard Piano">
            <div class="product-info">
                <h2>88-Key Digital Piano</h2>
                <p class="price">R5,200.00</p>
                <button class="cart-btn">Add to Cart</button>
            </div>
        </article>

        <!-- Product Card 4: Violin -->
        <article class="product-card">
            <img src="https://images.unsplash.com/photo-1612225330812-01a9c6b355ec?auto=format&fit=crop&w=600&q=80" alt="Classical Violin">
            <div class="product-info">
                <h2>Classical Acoustic Violin</h2>
                <p class="price">R1,950.00</p>
                <button class="cart-btn">Add to Cart</button>
            </div>
        </article>

        <!-- Product Card 5: Saxophone -->
        <article class="product-card">
            <img src="https://images.unsplash.com/photo-1573871665825-814d48c8942b?auto=format&fit=crop&w=600&q=80" alt="Brass Saxophone">
            <div class="product-info">
                <h2>E-Flat Alto Saxophone</h2>
                <p class="price">R6,400.00</p>
                <button class="cart-btn">Add to Cart</button>
            </div>
        </article>

        <!-- Product Card 6: Drum Kit -->
        <article class="product-card">
            <img src="https://images.unsplash.com/photo-1519892300165-cb5542fb47c7?auto=format&fit=crop&w=600&q=80" alt="Drum Kit Set">
            <div class="product-info">
                <h2>5-Piece Drum Kit</h2>
                <p class="price">R7,800.00</p>
                <button class="cart-btn">Add to Cart</button>
            </div>
        </article>

    </main>

</body>
</html>
